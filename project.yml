name: FidgetFriends
options:
  bundleIdPrefix: com.ashleyjleventhal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  FidgetFriends:
    type: application
    platform: iOS
    sources: [FidgetFriends]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashleyjleventhal.fidgetfriends
        PRODUCT_NAME: FidgetFriends
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fidget Friends
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.kids-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Fidget Friends saves your collection picture to Photos only when a grown-up chooses Save Image."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  FidgetFriendsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FidgetFriendsTests]
    dependencies:
      - target: FidgetFriends
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ashleyjleventhal.fidgetfriends.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FidgetFriends.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FidgetFriends"
        BUNDLE_LOADER: "$(TEST_HOST)"
  FidgetFriendsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FidgetFriendsUITests]
    dependencies:
      - target: FidgetFriends
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ashleyjleventhal.fidgetfriends.uitests
        TEST_TARGET_NAME: FidgetFriends
schemes:
  FidgetFriends:
    build:
      targets:
        FidgetFriends: all
    test:
      gatherCoverageData: false
      targets:
        - FidgetFriendsTests
        - FidgetFriendsUITests
